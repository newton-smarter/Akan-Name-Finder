<!DOCTYPE html>
<html lang="en">

<head>
    <meta><UTF-8>
        <title>Akan Name Finder</title>
        <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Akan Name Finder</h1>
    <!--New Section for Intro or Info -->
    <section class="Intro">
        <p>Discover your Akan name based on the day of the week you were born and your gender. Just enter your date of
            birth and select your gender below!</p>
    </section>
    <form id="akanForm"></form>
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" required>

    <label for="gender">Gender:</label>
    <select id="gender" required>
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
    </select>
    <button type="submit">Get Akan Name</button>
    </form>
    <div class="result" id="result"></div>
    <script src="script.js"></script>
</body>

</html>
